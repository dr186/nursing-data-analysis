[project]
name = "nursing-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter-core>=5.9.1",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
]

[project.scripts]
nursing-data = "nursing_data:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
